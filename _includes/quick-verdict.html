{% assign verdict_text = include.verdict | default: page.verdict | default: page.first_paragraph %}
{% if verdict_text and verdict_text != "" %}
<div class="alert alert-info quick-verdict-box" style="border-left: 4px solid #277c80; background: #f7fafb; padding: 18px; margin-bottom: 25px; border-radius: 4px;">
  <strong class="quick-verdict-title" style="text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; color: #277c80; display: block; margin-bottom: 6px;">
    ⚡ {{ include.title | default: "Quick Reading Verdict" }}
  </strong>
  <p class="quick-verdict-text" style="margin-bottom: 0; font-size: 1.05rem; line-height: 1.5; color: #24292e;">
    {{ verdict_text }}
  </p>
</div>
{% endif %}
